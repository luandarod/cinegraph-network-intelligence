[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cinegraph-network-intelligence"
version = "0.1.0"
description = "Reproducible graph analytics pipeline for CineGraph Network Intelligence."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
]

[project.scripts]
cinegraph-pipeline = "cinegraph_network_intelligence.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
